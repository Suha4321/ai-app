apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-app.fullname" . }}-ollama
  labels:
    {{- include "ai-app.labels" . | nindent 4 }}
    component: ollama
spec:
  replicas: {{ .Values.ollama.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "ai-app.selectorLabels" . | nindent 6 }}
      component: ollama
  template:
    metadata:
      labels:
        {{- include "ai-app.selectorLabels" . | nindent 8 }}
        component: ollama
    spec:
      initContainers:
      - name: pull-models
        image: ollama/ollama:latest
        command:
          - /bin/sh
          - -c
          - |
            ollama serve &
            pid=$!
            until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 1; done
            {{- range .Values.ollama.models }}
            ollama pull {{ . }}
            {{- end }}
            kill $pid
        volumeMounts:
          - name: ollama-data
            mountPath: /root/.ollama
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}

      containers:
      - name: ollama
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.ollama.containerPort }}
          protocol: TCP

        resources:
          {{- toYaml .Values.ollama.resources | nindent 12 }}

        volumeMounts:
        - name: ollama-data
          mountPath: {{ .Values.ollama.persistence.mountPath }}

        # Liveness probe
        livenessProbe:
          httpGet:
            path: {{ .Values.ollama.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

        # Readiness probe
        readinessProbe:
          httpGet:
            path: {{ .Values.ollama.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: {{ include "ai-app.fullname" . }}-ollama-pvc
