apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-app.fullname" . }}-fastapi
  labels:
    {{- include "ai-app.labels" . | nindent 4 }}
    component: fastapi
spec:
  replicas: {{ .Values.fastapi.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "ai-app.selectorLabels" . | nindent 6 }}
      component: fastapi
  template:
    metadata:
      labels:
        {{- include "ai-app.selectorLabels" . | nindent 8 }}
        component: fastapi
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}

      containers:
      - name: fastapi
        image: "{{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.fastapi.containerPort }}
          protocol: TCP

        # Load all config from ConfigMap
        envFrom:
        - configMapRef:
            name: {{ include "ai-app.fullname" . }}-config

        # Service URLs
        env:
        - name: OLLAMA_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "ai-app.fullname" . }}-config
              key: OLLAMA_URL

        resources:
          {{- toYaml .Values.fastapi.resources | nindent 12 }}

        # Liveness probe
        livenessProbe:
          httpGet:
            path: {{ .Values.fastapi.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

        # Readiness probe
        readinessProbe:
          httpGet:
            path: {{ .Values.fastapi.healthCheck.readinessPath }}
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

      # Init container to wait for Ollama
      initContainers:
      - name: wait-for-ollama
        image: curlimages/curl:8.11.1
        command:
          - sh
          - -c
          - |
            until curl -s http://{{ include "ai-app.fullname" . }}-ollama:{{ .Values.ollama.port }}/api/tags > /dev/null; do
              echo "waiting for ollama..."
              sleep 2
            done
            echo "ollama is ready"
